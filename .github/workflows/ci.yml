name: CI

on:
  # Every pushed branch must be verified: a green `main` alone does not prove
  # that a release branch or a hotfix commit was tested. Pull requests and
  # manual dispatches are additional entry points, not replacements.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lua ${{ matrix.lua }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        lua: ["5.3.6", "5.4.9", "5.5.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Lua ${{ matrix.lua }} from source
        run: |
          set -euo pipefail
          version="${{ matrix.lua }}"
          archive="lua-$version.tar.gz"

          download() {
            echo "fetching $1"
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 300 "$1" -o "$archive"
          }

          # lua.org is canonical but has been unreachable from the macOS
          # runners. Retry it, then take the same tagged release from the
          # official GitHub mirror.
          if ! download "https://www.lua.org/ftp/lua-$version.tar.gz"; then
            echo "primary download failed; using the GitHub mirror" >&2
            download "https://github.com/lua/lua/archive/refs/tags/v$version.tar.gz"
          fi

          tar xzf "$archive"
          test -d "lua-$version"

          if [ -d "lua-$version/src" ]; then
            # Release tarball layout: a root Makefile with a src/ directory.
            # The posix target needs no readline and builds on both runners.
            make -C "lua-$version" posix
            echo "LUA_BIN=$PWD/lua-$version/src/lua" >> "$GITHUB_ENV"
          else
            # The GitHub mirror is the flat development tree, which has no
            # release Makefile targets. Compile the interpreter with the same
            # POSIX configuration as `make posix`; ltests.c is a test-only
            # unit that would add its own entry points.
            (
              cd "lua-$version"
              cc -O2 -DLUA_USE_POSIX -o lua \
                $(ls *.c | grep -vE '^(luac|onelua|ltests)\.c$') -lm -ldl
            )
            echo "LUA_BIN=$PWD/lua-$version/lua" >> "$GITHUB_ENV"
          fi

      - name: Report interpreter version
        run: |
          set -euo pipefail
          "$LUA_BIN" -v
          "$LUA_BIN" -e 'assert(math.maxinteger > 2^53, "64-bit integers required")'

      - name: Run conformance suite
        run: |
          set -euo pipefail
          "$LUA_BIN" spec/run.lua | tee conformance.txt
          grep -Eq '^[0-9]+ tests, [0-9]+ assertions: [0-9]+ passed, 0 failed$' conformance.txt

  integer-width:
    name: 32-bit integer guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Lua 5.4 with 32-bit integers
        run: |
          set -euo pipefail
          version=5.4.9
          archive="lua-$version.tar.gz"

          download() {
            echo "fetching $1"
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 300 "$1" -o "$archive"
          }

          if ! download "https://www.lua.org/ftp/lua-$version.tar.gz"; then
            echo "primary download failed; using the GitHub mirror" >&2
            download "https://github.com/lua/lua/archive/refs/tags/v$version.tar.gz"
          fi

          tar xzf "$archive"
          test -d "lua-$version"

          if [ -d "lua-$version/src" ]; then
            # Lua release tarballs override the -DLUA_32BITS compiler flag
            # with their own header definition. Configure this test build
            # directly, then verify the resulting 32-bit interpreter below.
            sed -i 's/^#define LUA_32BITS[[:space:]]*0$/#define LUA_32BITS 1/' "lua-$version/src/luaconf.h"
            grep -q '^#define LUA_32BITS 1$' "lua-$version/src/luaconf.h"
            make -C "lua-$version" posix
            echo "LUA_BIN=$PWD/lua-$version/src/lua" >> "$GITHUB_ENV"
          else
            (
              cd "lua-$version"
              # The flat tree hardcodes LUA_32BITS 0 in luaconf.h, so the
              # define has to be edited rather than passed on the command line.
              sed -i 's/^#define LUA_32BITS[[:space:]]*0$/#define LUA_32BITS 1/' luaconf.h
              grep -q '^#define LUA_32BITS 1$' luaconf.h
              cc -O2 -DLUA_USE_POSIX -o lua \
                $(ls *.c | grep -vE '^(luac|onelua|ltests)\.c$') -lm -ldl
            )
            echo "LUA_BIN=$PWD/lua-$version/lua" >> "$GITHUB_ENV"
          fi

      - name: Assert that the library refuses a 32-bit build
        run: |
          set -euo pipefail
          # Prove the interpreter really is 32-bit before trusting the result.
          "$LUA_BIN" -e 'assert(math.maxinteger < 78364164095, "expected a 32-bit build")'

          if "$LUA_BIN" -e '
            package.path = "./src/?.lua;./src/?/init.lua;" .. package.path
            require("pikaid")
          ' 2> refusal.txt; then
            echo "pikaid loaded on a 32-bit integer build" >&2
            exit 1
          fi

          cat refusal.txt
          grep -q "64-bit integers" refusal.txt

  quality:
    name: lint, oracle and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Lua 5.4.9 with retry and mirror fallback
        run: bash ci/install-lua.sh

      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4

      - name: Install tooling
        run: |
          luarocks install luacheck
          luarocks install luacov

      - name: Lint
        run: luacheck src spec

      - name: Verify the independent oracle fixture
        run: |
          set -euo pipefail
          python3 spec/tools/generate_reference_cases.py
          git diff --exit-code -- spec/fixtures/reference-cases.json

      - name: Coverage
        run: |
          set -euo pipefail
          # The LuaRocks action exports its install tree through LUA_PATH. Keep
          # that path mounted so `-lluacov` resolves, then prepend the source
          # directories used by the suite.
          eval "$(luarocks path)"
          LUA_PATH="./src/?.lua;./src/?/init.lua;${LUA_PATH:-}" lua -lluacov spec/run.lua
          luacov
          sed -n '/^Summary/,$p' luacov.report.out
          total=$(awk '/^Total[[:space:]]/{print $4}' luacov.report.out | tr -d '%')
          if [ -z "$total" ]; then
            echo "could not read the coverage total" >&2
            exit 1
          fi
          case "$total" in
            ''|*[!0-9.]*)
              echo "invalid coverage total: $total" >&2
              exit 1
              ;;
          esac
          echo "line coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total + 0 < 98) { print "coverage below the 98% gate"; exit 1 } }'

  package:
    name: package and consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Lua 5.4.9 with retry and mirror fallback
        run: bash ci/install-lua.sh

      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4

      - name: Generate the current-version rockspec
        shell: bash
        run: |
          set -euo pipefail
          rockspec="$(python3 ci/prepare-rockspec.py)"
          version="$(lua -e 'package.path = "./src/?.lua;./src/?/init.lua;" .. package.path; print(require("pikaid").VERSION)')"
          echo "PIKAID_ROCKSPEC=$rockspec" >> "$GITHUB_ENV"
          echo "PIKAID_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint the rockspec
        run: luarocks lint "$PIKAID_ROCKSPEC"

      - name: Install from the rockspec
        run: luarocks make "$PIKAID_ROCKSPEC"

      - name: Verify the tracked archive is clean
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=archive/ HEAD | tar -t > archive.txt
          cat archive.txt

          for forbidden in \
            'archive/.ai/' \
            'archive/opencode.jsonc' \
            'archive/.DS_Store' \
            'archive/luacov.'
          do
            if grep -Fq "$forbidden" archive.txt; then
              echo "forbidden path in the source archive: $forbidden" >&2
              exit 1
            fi
          done

          grep -Fq 'archive/src/pikaid/init.lua' archive.txt
          grep -Fq 'archive/spec/vectors/pikaid-v1.json' archive.txt
          # The test-only official-suite bridge is source-controlled, but it is
          # not part of the installed library (see the rockspec module list).
          grep -Fq 'archive/spec/tools/jsonl_adapter.lua' archive.txt

      - name: Run the README quick start against the installed package
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cat > consumer.lua <<'LUA'
          local pikaid = require("pikaid")

          assert(pikaid.VERSION == os.getenv("PIKAID_VERSION"), "installed version")

          local id = "0s44we8002loz3po6mcf6vsn23"
          assert(pikaid.validate(id), "documented sample validates")
          assert(pikaid.is_well_formed(id), "documented sample is well formed")
          assert(pikaid.timestamp(id) == 1700000000, "documented timestamp")
          assert(#pikaid.to_binary(id) == 17, "binary width")
          assert(pikaid.from_binary(pikaid.to_binary(id)) == id, "round trip")

          local randomness_hex = pikaid.randomness(id):gsub(".", function(c)
            return string.format("%02x", string.byte(c))
          end)
          assert(randomness_hex == "00112233445566778899aabb", "documented randomness")

          local ids = pikaid.new({
            entropy = function()
              return string.rep("\0", 12)
            end,
            clock = function()
              return 0
            end,
          })
          assert(ids.generate() == "00000000000000000000000000", "injected providers")

          local generated = pikaid.generate()
          assert(pikaid.validate(generated), "generated value validates")
          assert(#generated == 26, "text width")
          assert(#pikaid.generate_binary() == 17, "binary width")

          print("installed pikaid " .. pikaid.VERSION .. " ok: " .. generated)
          LUA
          lua consumer.lua

  official-suite:
    name: official conformance suite (automated)
    runs-on: ubuntu-latest
    env:
      # Immutable upstream fixture revision. Changing this SHA is a reviewed
      # change, never a floating branch: the suite is the authority for the
      # cases below and must be identical for every run.
      PIKAID_SPECS_SHA: 059780cc0e5b113443812720d95c630649bf3aa3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out the official suite at the pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: pikaid/pikaid-specs
          ref: ${{ env.PIKAID_SPECS_SHA }}
          path: pikaid-specs

      - name: Assert the suite checkout is exactly the pinned commit
        run: |
          set -euo pipefail
          actual="$(git -C pikaid-specs rev-parse HEAD)"
          test "$actual" = "$PIKAID_SPECS_SHA"
          echo "suite commit: $actual"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.4.9 with retry and mirror fallback
        run: bash ci/install-lua.sh

      - name: Install suite dependencies
        run: |
          set -euo pipefail
          # The suite's only third-party dependency; pinned so a new upstream
          # release cannot change validation behaviour between runs.
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Verify fixture integrity and vector digests
        working-directory: pikaid-specs/conformance
        run: |
          set -euo pipefail
          python3 tools/verify_vectors.py \
            --expect-status OFFICIAL \
            --expect-package-revision 1.0.0 \
            --expect-spec-revision 1.0.4

      - name: Run the official verifier unit tests
        working-directory: pikaid-specs/conformance
        run: python3 -m unittest discover -s tools/tests -v

      - name: Run the independent Node oracle
        working-directory: pikaid-specs/conformance
        run: node tools/verify_oracle_node.mjs

      - name: Run the JSONL adapter against the official suite
        working-directory: pikaid-specs/conformance
        run: |
          set -euo pipefail
          # `--automated-only` exits 0 only when every automated check passes.
          # The manual security audits stay outstanding, so this step proves
          # automated conformance, not a certification.
          python3 tools/run_adapter.py \
            --automated-only \
            --report-json "$RUNNER_TEMP/official-conformance.json" \
            -- lua "$GITHUB_WORKSPACE/spec/tools/jsonl_adapter.lua"

      - name: Upload the automated conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-conformance-report
          path: ${{ runner.temp }}/official-conformance.json
          if-no-files-found: warn
